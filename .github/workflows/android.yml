name: Android APK
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - name: Install Android SDK packages
     run: |
       SDKMANAGER=$(find /usr/local/lib/android/sdk /opt/android-sdk -path '*/bin/sdkmanager' -type f 2>/dev/null | head -n 1)
       if [ -z "$SDKMANAGER" ]; then echo "SDK manager not found"; exit 1; fi
       yes | "$SDKMANAGER" --licenses || true
       "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.10.2'
   - run: gradle :app:assembleDebug
   - run: mkdir -p output && cp app/build/outputs/apk/debug/app-debug.apk output/Not.apk
   - uses: actions/upload-artifact@v4
     with:
      name: Not
      path: output/Not.apk
