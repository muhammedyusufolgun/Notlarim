name: Android APK
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - name: Install Android SDK packages
     run: |
       SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
       SDKMANAGER=$(find "$SDK_ROOT" -path '*/bin/sdkmanager' -type f -print -quit)
       if [ -z "$SDKMANAGER" ]; then echo "SDK manager not found"; exit 1; fi
       "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.10.2'
   - run: gradle :app:assembleDebug
   - run: mkdir -p output && cp app/build/outputs/apk/debug/app-debug.apk output/Not.apk
   - uses: actions/upload-artifact@v4
     with:
      name: Not
      path: output/Not.apk
